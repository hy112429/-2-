# electron-builder 打包配置
# 产物：NSIS 安装包（甲方交付）+ zip 便携版

appId: com.touguang.client
productName: 投广管理客户端
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build   # 图标等构建资源：desktop/build/

files:
  - out/**/*               # electron-vite 输出（main/preload/renderer）
  - package.json

asar: true

# Python 引擎 + ffmpeg 随包内置（resources/engine）
# 业务源码始终来自当前工作区；仅 Python 虚拟环境和 FFmpeg 使用已验证的 staging 运行时。
extraResources:
  - from: ../engine
    to: engine
    filter:
      - "*.py"
      - requirements.txt
      - extractors/**/*
      - resources/**/*
      - "!**/__pycache__/**"
      - "!test_*.py"
  # 运行时依赖只放入不与当前源码重叠的目录，避免 electron-builder 并行复制时覆盖源码。
  - from: D:/software/tg_pkg_staging/engine/.venv
    to: engine/.venv
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!pyvenv.cfg"
      - "!Scripts/**"
  # 随包带独立 CPython 标准运行时；安装版不得依赖构建机的绝对 Python 路径。
  - from: D:/software/tg_pkg_staging/engine/runtime
    to: engine/runtime
    filter:
      - "**/*"
      - "!**/__pycache__/**"
  - from: D:/software/tg_pkg_staging/engine/bin
    to: engine/bin
    filter:
      - "**/*"
  # 百应目录快照来自本机历史真实响应，仅用于新客户端首次启动种子。

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.png
  executableName: touguang-client

nsis:
  oneClick: false          # 使用向导安装，提供安装目录选择页
  perMachine: false        # 当前 Windows 用户安装，不要求管理员权限
  allowToChangeInstallationDirectory: true
  runAfterFinish: false    # 安装完成不自动启动客户端调度器
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 投广管理客户端

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
