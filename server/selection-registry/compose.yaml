services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: selection_registry
      MYSQL_USER: selection_registry
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - registry-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
  registry:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      REGISTRY_PORT: 8094
      REGISTRY_API_TOKEN: ${REGISTRY_API_TOKEN:?Set REGISTRY_API_TOKEN in .env}
      DB_URL: jdbc:mysql://mysql:3306/selection_registry?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: selection_registry
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8094:8094"
volumes:
  registry-mysql:
